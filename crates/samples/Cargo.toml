[package]
name = "buttervoice-samples"
version.workspace = true
description = "Labelled recordings for benchmarking: the one format the app writes and the replay tool reads"
edition = "2024"
publish = false

[dependencies]
buttervoice-core = { path = "../core" }
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
