[package]
name = "buttervoice-local"
version.workspace = true
description = "Transcription on this machine, through transcribe.cpp"
edition = "2024"
publish = false

[dependencies]
buttervoice-core = { path = "../core" }
thiserror = "2"

# Metal exists only on Apple Silicon; everywhere else the engine runs on the CPU.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[dev-dependencies]
tempfile = "3"
