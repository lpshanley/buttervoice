[package]
name = "buttervoice-grok"
version = "0.1.0"
description = "Transcription through xAI's speech-to-text API"
edition = "2024"
publish = false

[dependencies]
buttervoice-core = { path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
