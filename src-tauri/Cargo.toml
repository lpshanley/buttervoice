[package]
name = "buttervoice"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buttervoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
buttervoice-core = { path = "../crates/core" }
buttervoice-grok = { path = "../crates/grok" }
buttervoice-telemetry = { path = "../crates/telemetry" }
cpal = "0.18"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
security-framework = "3"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tauri-plugin-macos-permissions = "2.3.0"
buttervoice-local = { path = "../crates/local" }
rust-i18n = "4"
sys-locale = "0.3"
buttervoice-samples = { path = "../crates/samples" }
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tempfile = "3"
